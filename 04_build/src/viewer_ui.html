<style id="m3d-ui-css">
/* 2026-10-24 (Lior A1, A2), injected by compile_models3d.py: the on-screen camera / cursor text hides with Labels off or a hidden panel; project-picture picker for photo match */
html.m3d-hud-off #hud, html.m3d-hud-off .m3d-hudx { display: none !important; }
.m3d-pickbtn { display: inline-block; margin: 4px 0; font: 600 12px/1.2 system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; background: #0b6b9e; border: 1px solid #0b6b9e; border-radius: 5px; padding: 5px 9px; cursor: pointer; }
.m3d-pickbtn:hover { background: #0d80bd; }
.m3d-picker { position: fixed; inset: 0; z-index: 2147483600; background: rgba(5,10,15,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
.m3d-picker[hidden] { display: none; }
.m3d-picker .pk { background: #101820; color: #e8eef2; border: 1px solid #38505f; border-radius: 10px; width: min(980px, 100%); max-height: 100%; overflow: auto; padding: 12px 14px; font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
.m3d-picker .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }

.m3d-picker h4.plan { color: #ffd479; }
.m3d-picker .gr { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.m3d-picker .it { display: flex; flex-direction: column; gap: 4px; text-align: left; background: #16222b; color: #e8eef2; border: 1px solid #2b3a46; border-radius: 6px; padding: 5px; cursor: pointer; font: 11px/1.3 system-ui, sans-serif; }
.m3d-picker .it.plan { border-color: #b8902a; }

.m3d-picker .it img { width: 100%; height: 100px; object-fit: contain; background: #0b1117; border-radius: 4px; }
.m3d-picker .note { color: #8fa3b1; margin: 0 0 4px; }
</style>
<script>(function () {

    var r = document.getElementById('readout'); if (r && getComputedStyle(r).position === 'absolute') r.classList.add('m3d-hudx');

    setTimeout(apply, 300); setTimeout(apply, 1500);
  });

  /* A2: choose one of the project's pictures for the viewer's own photo match (same pictures as the page's photo panel; "Plan shape" first) */
  var PICS = /*M3D_PICS*/null;
  ready(function () {
    if (!PICS || !PICS.length) return;
    var inp = document.querySelector('input[type="file"][accept^="image"]'); if (!inp) return;

    ov.innerHTML = '<div class="pk"><div class="hd"><b>Project pictures for photo match (' + PICS.length + ')</b><button type="button" class="x" data-x>Close</button></div>' +

      groups.map(function (g) {

          g.items.map(function (p) { return '<button type="button" class="it' + (g.key === 'plan' ? ' plan' : '') + '" data-pick="' + esc(p.id) + '" title="' + esc(p.t) + '"><img src="' + esc(p.th) + '" alt="" loading="lazy"><span>' + esc(p.t.length > 90 ? p.t.slice(0, 88) + '…' : p.t) + '</span></button>'; }).join('') + '</div>';
      }).join('') + '</div>';
    document.body.appendChild(ov);
    function close() { ov.hidden = true; b.focus(); }
    b.addEventListener('click', function () { ov.hidden = false; var f = ov.querySelector('[data-pick]'); if (f) f.focus(); });

      var orig = URL.createObjectURL;
      // the viewer's own handler reads files[0] and calls URL.createObjectURL(file): hand it the picture's URL instead (works from file:// too)
      URL.createObjectURL = function (o) { return (o && o.name === name) ? url : orig.apply(URL, arguments); };

  });
})();</script>
