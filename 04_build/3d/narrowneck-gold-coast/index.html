  const vb = $('vb'); Object.keys(VIEWS).forEach(k => { const b = document.createElement('button'); b.textContent = VIEWS[k].label; b.onclick = () => gotoView(k); vb.appendChild(b); });

}
function updateInfoText() {

const SRCN = { s3: 'Esri Wayback r9812 aerial, 8 Aug 2020', s12: 'Garmin Navionics SonarChart (6 Oct 2026)', cor23: 'Corbett et al. 2023 (Coasts & Ports) Figs 2-3', vds21: 'Vieira da Silva et al. 2021 (Coastal Eng. 171)', jack12: 'Jackson et al. 2012 (ICCE 33)', jack07: 'Jackson et al. 2007 (Shore & Beach 75)' };

$('mclose').onclick = () => $('modal').style.display = 'none'; $('modal').onclick = e => { if (e.target === $('modal')) $('modal').style.display = 'none'; };

// ---------------------------------------------------------------------------------------------- sources tab
(function mkSources() {

// ---------------------------------------------------------------------------------------------- docs tab (small markdown renderer)
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function md(src) {
  const L = src.replace(/\r/g, '').split('\n'); let out = [], i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(esc(L[i++])); i++; out.push('<pre>' + b.join('\n') + '</pre>'); continue; }
    let m = l.match(/^(#{1,4})\s+(.*)$/); if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const hd = cells(l); i += 2; let rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><tr>' + hd.map(c => `<th>${inline(c)}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>'); continue;
    }
    if (/^\s*[-*]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) b.push('<li>' + inline(L[i++].replace(/^\s*[-*]\s+/, '')) + '</li>'); out.push('<ul>' + b.join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) b.push('<li>' + inline(L[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); out.push('<ol>' + b.join('') + '</ol>'); continue; }
    if (/^>\s?/.test(l)) { let b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(inline(L[i++].replace(/^>\s?/, ''))); out.push('<blockquote>' + b.join('<br>') + '</blockquote>'); continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (!l.trim()) { i++; continue; }
    let b = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+[.)]\s|>|\s*\|)/.test(L[i])) b.push(inline(L[i++])); out.push('<p>' + b.join(' ') + '</p>');
  }
  return out.join('\n');
}
(function mkDoc() {
  const d = $('doc'); const keys = [['methods_md', 'METHODS_3D.md'], ['sources_use_md', 'Sources: how used'], ['assumptions_md', 'Assumptions'], ['decisions_md', 'Decisions'], ['sources_md', 'SOURCES_3D.md']].filter(k => DOCS[k[0]]);
  d.innerHTML = '<div class="chips" id="dtabs"></div><div id="dbody"></div>';
  const show = k => { $('dbody').innerHTML = md(DOCS[k]); [...$('dtabs').children].forEach(b => b.classList.toggle('on', b.dataset.k === k)); $('t4').scrollTop = 0; };
  keys.forEach(([k, n]) => { const b = document.createElement('button'); b.textContent = n; b.dataset.k = k; b.onclick = () => show(k); $('dtabs').appendChild(b); });
  if (keys.length) show(keys[0][0]); else $('dbody').textContent = 'No documentation loaded (docs.js).';
})();

// ---------------------------------------------------------------------------------------------- photo match
const ph = { x: 0, y: 20, z: 1.7, h: 86, p: 0, fov: 60, op: 0.5, on: false };
function mkPhoto() {
  $('t2').innerHTML = `<div class="small">Align the model with a photo: load a local image (not uploaded anywhere), tick <i>Photo match</i>, then set camera position (canonical x, y, height above MSL), heading (true bearing), pitch and horizontal field of view until the rock outlines line up. <b>Copy camera</b> gives the parameters for later alignment work. Vertical exaggeration is forced to ×1.</div>
  <div class="row"><input type="file" id="pfile" accept="image/*"></div>
  <div class="row"><label><input type="checkbox" id="pon"> Photo match mode</label><button id="pcur">Use current camera</button><button id="pcopy">Copy camera</button></div>
  <div class="row"><label>overlay opacity</label><input type="range" id="pop" min="0" max="1" step="0.05" value="0.5"><span id="popo">0.5</span></div>
  ${[['x', 'x alongshore (+north) m', -400, 400, 0.5], ['y', 'y offshore (east) m', -50, 700, 0.5], ['z', 'height above MSL m', -2, 120, 0.1], ['h', 'heading (true bearing) °', 0, 360, 0.5], ['p', 'pitch ° (+ up)', -60, 60, 0.1], ['fov', 'horizontal FOV °', 10, 120, 0.5]].map(([k, n, a, b, s]) => `<div class="row"><label>${n}</label><input type="range" id="ps_${k}" min="${a}" max="${b}" step="${s}"><input type="number" id="pn_${k}" step="${s}" style="width:70px"></div>`).join('')}
  <div class="small" id="pjson" style="white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace"></div>
  <div class="small">Beach preset: the reef lies 210-370 m offshore, so a phone photo from the beach shows it very small; use a telephoto crop or an elevated viewpoint (drone, tower, hill). The drone photo img-24 in the registry is a good first test. Photo FOV is usually 60-75° horizontal for a phone main camera.</div>`;
  ['x', 'y', 'z', 'h', 'p', 'fov'].forEach(k => {
    const s = $('ps_' + k), n = $('pn_' + k); const set = v => { ph[k] = v; s.value = v; n.value = v; applyPhotoCam(); };
    s.oninput = () => set(parseFloat(s.value)); n.onchange = () => set(parseFloat(n.value)); s.value = ph[k]; n.value = ph[k];
  });
  $('pon').onchange = e => setPhotoMode(e.target.checked);
  $('pcur').onclick = () => { syncFromCamera(); };
  $('pop').oninput = e => { ph.op = parseFloat(e.target.value); $('photo').style.opacity = ph.op; $('popo').textContent = ph.op.toFixed(2); };
  $('pcopy').onclick = () => { const j = camJSON(); const t = JSON.stringify(j, null, 1); if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => { }); $('pjson').textContent = t; };
  $('pfile').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = $('photo'); img.onload = () => { photoAspect = img.naturalWidth / img.naturalHeight; img.style.display = 'block'; img.style.opacity = ph.op; resize(); }; img.src = URL.createObjectURL(f); };
}
let photoAspect = 0;
function camState() {
  const d = new THREE.Vector3(); camera.getWorldDirection(d); const ve = state.ve;
  const dt = new THREE.Vector3(d.x, d.y / ve, d.z).normalize();
  const hdg = bearing(dt.x, dt.z), pitch = Math.asin(dt.y) / D2R;
  const vfov = camera.fov, hfov = 2 * Math.atan(Math.tan(vfov * D2R / 2) * camera.aspect) / D2R;
  return { x: camera.position.x, y: camera.position.z, z: camera.position.y / ve, hdg, pitch, vfov, hfov };
}
function camJSON() { const c = camState(); return { model: 'narrowneck-gold-coast', version: state.ver, frame: 'canonical x north (bearing 356.2), y offshore (east, bearing 86.2), metres', x_m: +c.x.toFixed(2), y_m: +c.y.toFixed(2), z_m_MSL: +c.z.toFixed(2), z_m_AHD: +(c.z + A0 - gshift).toFixed(2), datum_rule: state.datum, heading_true_deg: +c.hdg.toFixed(1), pitch_deg: +c.pitch.toFixed(1), hfov_deg: +c.hfov.toFixed(1), vfov_deg: +c.vfov.toFixed(1), aspect: +camera.aspect.toFixed(3), water_level_m_MSL: state.wl, vertical_exaggeration: state.ve }; }
function syncFromCamera() { const c = camState(); Object.assign(ph, { x: c.x, y: c.y, z: c.z, h: (c.hdg + 360) % 360, p: c.pitch, fov: c.hfov }); ['x', 'y', 'z', 'h', 'p', 'fov'].forEach(k => { $('ps_' + k).value = ph[k]; $('pn_' + k).value = +ph[k].toFixed(2); }); }
function applyPhotoCam() {
  if (!state.photoMode) return;
  camera.position.set(ph.x, ph.z, ph.y);
  const [dx, dy] = dirFromBearing(ph.h), cp = Math.cos(ph.p * D2R), sp = Math.sin(ph.p * D2R);
  camera.lookAt(camera.position.x + dx * cp, camera.position.y + sp, camera.position.z + dy * cp);
  camera.fov = 2 * Math.atan(Math.tan(ph.fov * D2R / 2) / camera.aspect) / D2R; camera.updateProjectionMatrix();
}
function setPhotoMode(on) {
  state.photoMode = on; controls.enabled = !on;
  if (on) { syncFromCamera(); setVE(1); } else { controls.target.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 80); controls.update(); }
  applyPhotoCam(); resize();
}

// ---------------------------------------------------------------------------------------------- resize, HUD, cursor read-out, loop
function resize() {
  const v = $('view'), W = v.clientWidth, H = v.clientHeight, w = $('wrap');
  let cw = W, ch = H;
  if (photoAspect && state.photoMode) { if (W / H > photoAspect) { ch = H; cw = H * photoAspect; } else { cw = W; ch = W / photoAspect; } }
  w.style.width = cw + 'px'; w.style.height = ch + 'px'; w.style.inset = 'auto'; w.style.left = (W - cw) / 2 + 'px'; w.style.top = (H - ch) / 2 + 'px';
  renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix(); applyPhotoCam();
}
window.addEventListener('resize', resize);
$('tabs').onclick = e => { const t = e.target.dataset && e.target.dataset.t; if (!t) return; [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); document.querySelectorAll('.tab').forEach(d => d.classList.toggle('on', d.id === t)); };
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let curTxt = '';
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera); const objs = [reefMesh, seabedMesh].filter(Boolean); const h = ray.intersectObjects(objs, false)[0];
  curTxt = h ? `cursor x ${h.point.x.toFixed(1)}  y ${h.point.z.toFixed(1)}  z ${fmt(h.point.y / state.ve)} m MSL = ${fmt(h.point.y / state.ve - gshift + A0)} m AHD  (${(state.wl - h.point.y / state.ve).toFixed(2)} m below water)` : '';
});
function hud() {
  const c = camState();
  $('hud').textContent = `camera x ${c.x.toFixed(1)}  y ${c.y.toFixed(1)}  z ${fmt(c.z, 1)} m MSL (${fmt(c.z + A0 - gshift, 1)} AHD)\nheading ${c.hdg.toFixed(0)}° (true)  pitch ${c.pitch.toFixed(0)}°  FOV ${c.vfov.toFixed(0)}° v / ${c.hfov.toFixed(0)}° h\n` + curTxt;
  const cr = $('camro'); if (cr) cr.textContent = `view: ${VIEWS[curView] ? VIEWS[curView].label : 'free'}`;
}
function loop() {
  requestAnimationFrame(loop); if (!state.photoMode) controls.update();
  renderer.render(scene, camera); const w = $('wrap').clientWidth, h = $('wrap').clientHeight; updateLabels(w, h); hud();
}
mkControls(); mkPhoto(); setVersion(state.ver); setWater(state.wl); setVE(state.ve); resize(); gotoView(VIEWS[curView] ? curView : 'oblique'); loop();
if (hp.get('tab')) { const b = document.querySelector('#tabs button[data-t="' + hp.get('tab') + '"]'); if (b) b.click(); }          // #tab=t1..t4
if (hp.get('info')) $('info').click();           // #info=1 opens the version pop-up (used for the headless preview)
window.__ready = true;
</script>
