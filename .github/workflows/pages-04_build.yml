# Publishes ONLY the page folder (04_build/) to GitHub Pages, so papers/ and the
# research folders stay private. Run it from the Actions tab ("Run workflow").
# Settings -> Pages -> Source must be "GitHub Actions".
name: Publish page preview (04_build only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            04_build/artificial_reefs.html
            04_build/assets
            04_build/3d
          sparse-checkout-cone-mode: false
      - name: Assemble site
        run: |
          mkdir -p _site
          cp 04_build/artificial_reefs.html _site/
          cp 04_build/artificial_reefs.html _site/index.html
          cp -r 04_build/assets 04_build/3d _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
