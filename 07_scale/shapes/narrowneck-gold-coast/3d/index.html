<style>
:root{--bg:#10171e;--panel:#17212b;--ink:#e6edf3;--mut:#9fb0bf;--line:#2a3846;--acc:#4aa3df;--warn:#e0a030;--ok:#5fb878}

body{display:flex;flex-direction:column}

#top h1{grid-area:h;font-size:15px;margin:0;white-space:nowrap}
#state{grid-area:s;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:600;font-size:12px;color:#10171e}
.b-high{background:var(--ok)}.b-medium{background:var(--warn)}.b-low{background:#d9645a}
#conf{grid-area:c;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

select,button,input{font:inherit;color:var(--ink)}

button:hover{background:#2c4054}
button.on{background:var(--acc);color:#07121b}
#info{width:22px;height:22px;border-radius:50%;padding:0;font-weight:700;font-family:Georgia,serif}
#app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
#view{position:relative;overflow:hidden;background:#0b1117}
#wrap{position:absolute;inset:0;margin:auto}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.row label{min-width:120px;color:var(--mut)}
input[type=range]{flex:1;min-width:120px}
h3{margin:10px 0 4px;font-size:13px;color:var(--acc)}
.chips button{padding:2px 6px;font-size:11px;margin:1px}
table{border-collapse:collapse;width:100%;font-size:11px}

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const M = window.REEF_MODEL, DOCS = window.REEF_DOCS || {};
const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const A0 = M.datum.ahd_msl_msq;                      // MSL = AHD + a (MSQ default a = +0.12); geometry is stored for a = +0.12

const FR = M.frame, BX = FR.bearing_x_deg * D2R, BY = FR.bearing_y_deg * D2R;

// ---------------------------------------------------------------------------------------------- state
const state = { ver: M.default_version, wl: 0, ve: 1, show: { water: true, seabed: true, reef: true, labels: true, grid: true, outline: true, faint: false }, photoMode: false, datum: 'msq', others: {} };
const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
if (hp.get('version') && M.versions.some(v => v.id === hp.get('version'))) state.ver = hp.get('version');
const allLevels = [...M.levels, ...M.extra_levels];
const wlMin = M.levels.find(l => l.id === M.slider.min_id).z, wlMax = M.levels.find(l => l.id === M.slider.max_id).z;
if (hp.get('water')) { const lv = allLevels.find(l => l.id === hp.get('water')); state.wl = lv ? lv.z : parseFloat(hp.get('water')); }
if (hp.get('datum') === 'icm') { state.datum = 'icm'; gshift = M.datum.alt[1].geom_shift; }
if (hp.get('ve')) state.ve = Math.min(5, Math.max(1, parseFloat(hp.get('ve')) || 1));
const verObj = () => M.versions.find(v => v.id === state.ver);

// ---------------------------------------------------------------------------------------------- renderer, camera
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c1218);
const camera = new THREE.PerspectiveCamera(45, 1, 0.3, 6000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = false; controls.maxPolarAngle = Math.PI * 0.995; controls.maxDistance = 1400; controls.minDistance = 1.5;

const sun = new THREE.DirectionalLight(0xfff2de, 1.6); sun.position.set(-200, 300, -100); scene.add(sun);
const world = new THREE.Group(); scene.add(world);              // scaled in Y by the vertical exaggeration
const geom = new THREE.Group(); world.add(geom);                // measured geometry (seabed, reef, outlines): shifted for the alternative datum

// ---------------------------------------------------------------------------------------------- seabed
const SB = M.seabed;
function seaAt(x, y) {                                          // bilinear seabed (m MSL)
  const fx = Math.min(SB.nx - 1.001, Math.max(0, (x - SB.x0) / SB.step)), fy = Math.min(SB.ny - 1.001, Math.max(0, (y - SB.y0) / SB.step));

  const z = SB.z; return z[j][i] * (1 - tx) * (1 - ty) + z[j][i + 1] * tx * (1 - ty) + z[j + 1][i] * (1 - tx) * ty + z[j + 1][i + 1] * tx * ty;

const ramp = [[-11, [20, 40, 62]], [-8, [28, 56, 78]], [-6, [44, 84, 104]], [-4, [78, 122, 130]], [-2.5, [120, 150, 130]], [-1.0, [170, 165, 120]], [0.5, [208, 190, 140]], [1.5, [222, 206, 156]], [3, [200, 190, 150]]];

}
let seabedMesh;
function buildSeabed() {
  const n = SB.nx * SB.ny, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), idx = [];
  for (let j = 0; j < SB.ny; j++) for (let i = 0; i < SB.nx; i++) {
    const k = j * SB.nx + i, z = SB.z[j][i]; pos.set([SB.x0 + i * SB.step, z, SB.y0 + j * SB.step], k * 3);
    const c = colourFor(z); col.set(c, k * 3);
    if (i < SB.nx - 1 && j < SB.ny - 1) { idx.push(k, k + SB.nx, k + 1, k + 1, k + SB.nx, k + SB.nx + 1); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
  seabedMesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })); seabedMesh.name = 'seabed'; geom.add(seabedMesh);
}
buildSeabed();

// ---------------------------------------------------------------------------------------------- reef (per version)
const reefCache = {}; let reefMesh = null, outlineLine = null;
const REEFCOL = [0.95, 0.52, 0.22];
function b64ToBuf(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function buildReef(v) {
  if (!v.solid) return { mesh: new THREE.Group(), line: drape(v.outline_m, OUTCOL[v.id] || 0xffd060, null) };
  const G = v.grid, nx = G.nx, ny = G.ny, H = new Int16Array(b64ToBuf(G.h_cm_b64));
  const pos = new Float32Array(nx * ny * 3), col = new Float32Array(nx * ny * 3), idx = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i, x = G.x0 + i * G.step, y = G.y0 + j * G.step, hv = H[k];
    const z = hv === -32768 ? seaAt(x, y) : hv / 100; pos.set([x, z, y], k * 3);
    const c = REEFCOL, h = 0.80 + 0.14 * (((i * 7919 + j * 104729) % 97) / 97) + Math.min(0.2, Math.max(0, (z + 5.5) * 0.045));
    col.set([c[0] * h, c[1] * h, c[2] * h], k * 3);
  }
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const k = j * nx + i;
    if (H[k] === -32768 && H[k + 1] === -32768 && H[k + nx] === -32768 && H[k + nx + 1] === -32768) continue;
    idx.push(k, k + nx, k + 1, k + 1, k + nx, k + nx + 1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const mesh = new THREE.Mesh(g, mat); mesh.name = 'reef'; mesh.renderOrder = 1;
  const line = drape(v.outline_m, 0xffd060, v.solid ? G : null);
  return { mesh, line };
}
const OUTCOL = { 'photo_2020-08-08': 0xffd060, 'design_option2_2017': 0xff7a59, 'design_2004_revised': 0x6fd0ff, 'survey_2011-06-09': 0xb28cff, 'navionics_4.0m_shoals': 0x7be07b };
function drape(rings, color, G, dz = 0.15) {                     // outline polygons draped on the seabed (or on the reef surface when G is given)
  const pts = []; const hgt = (x, y) => { const s = seaAt(x, y); return s; };
  rings.forEach(ring => { for (let q = 0; q < ring.length; q++) { const a = ring[q], b = ring[(q + 1) % ring.length]; const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 2));
    for (let t = 0; t < n; t++) { const x0 = a[0] + (b[0] - a[0]) * t / n, y0 = a[1] + (b[1] - a[1]) * t / n, x1 = a[0] + (b[0] - a[0]) * (t + 1) / n, y1 = a[1] + (b[1] - a[1]) * (t + 1) / n; pts.push(x0, hgt(x0, y0) + dz, y0, x1, hgt(x1, y1) + dz, y1); } } });
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color }));
}
function setVersion(id) {
  state.ver = id; const v = verObj();
  if (reefMesh) { geom.remove(reefMesh); geom.remove(outlineLine); }
  if (!reefCache[id]) reefCache[id] = buildReef(v);
  reefMesh = reefCache[id].mesh; outlineLine = reefCache[id].line; if (v.solid) geom.add(reefMesh); geom.add(outlineLine);
  $('ver').value = id; applyToggles(); updateInfoText(); writeHash();
}

// ---------------------------------------------------------------------------------------------- labels (HTML overlay)
const labels = [];
const PRIO = { reef: 1, north: 2, crest: 3, misc: 4, bar: 5, axis: 6 };
function addLabel(text, posFn, cls = '', group = 'misc') {
  const el = document.createElement('div'); el.className = 'lbl ' + cls; el.textContent = text; $('labels').appendChild(el); labels.push({ el, posFn, group, prio: PRIO[group] || 4 });
  return el;
}
const wlz = () => state.wl;
// ---------------------------------------------------------------------------------------------- water, grid, scale bars, north, shoreline
const water = new THREE.Mesh(new THREE.PlaneGeometry(SB.nx * SB.step - SB.step, SB.ny * SB.step - SB.step),
  new THREE.MeshPhongMaterial({ color: 0x2f7fb3, transparent: true, opacity: 0.30, side: THREE.DoubleSide, depthWrite: false, shininess: 80, specular: 0x88aacc }));
water.rotation.x = -Math.PI / 2; water.position.set(SB.x0 + (SB.nx - 1) * SB.step / 2, 0, SB.y0 + (SB.ny - 1) * SB.step / 2); water.renderOrder = 2; world.add(water);
const gridG = new THREE.Group(); world.add(gridG);
(function mkGrid() {
  const minor = [], major = [], x0 = -120, x1 = 120, y0 = 190, y1 = 420;
  for (let x = x0; x <= x1; x += 10) (x % 50 === 0 ? major : minor).push(x, 0, y0, x, 0, y1);
  for (let y = y0; y <= y1; y += 10) (y % 50 === 0 ? major : minor).push(x0, 0, y, x1, 0, y);
  const mk = (a, op) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3)); return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: op, depthWrite: false })); };
  gridG.add(mk(minor, 0.16)); gridG.add(mk(major, 0.42));
})();
const barG = new THREE.Group(); world.add(barG);
function bar(x0, y0, len, text) {   // x0 = start, scale bar along +x (alongshore)
  const pts = [x0, 0.05, y0, x0 + len, 0.05, y0, x0, 0.05, y0 - 2, x0, 0.05, y0 + 2, x0 + len, 0.05, y0 - 2, x0 + len, 0.05, y0 + 2];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  barG.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffee88 })));
  addLabel(text, () => m2s(x0 + len / 2, y0, wlz()), 'dim', 'bar');
}
const northG = new THREE.Group(); world.add(northG);
(function mkNorth() {
  const nx_ = FR.north_xy[0], ny_ = FR.north_xy[1], o = [-100, 160];
  northG.add(new THREE.ArrowHelper(new THREE.Vector3(nx_, 0, ny_).normalize(), new THREE.Vector3(o[0], 0.2, o[1]), 40, 0xff6644, 9, 6));
  addLabel('N', () => m2s(o[0] + nx_ * 48, o[1] + ny_ * 48, wlz()), 'water', 'north');
})();
// shoreline = defence line y = 0
(function mkShore() {
  const pts = []; for (let x = SB.x0; x <= SB.x0 + (SB.nx - 1) * SB.step; x += 5) pts.push(new THREE.Vector3(x, seaAt(x, 0) + 0.15, 0));
  geom.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff5a4a })));
})();

addLabel('Waterline of 8 Aug 2020 (y = 0)', () => m2s(0, 0, seaAt(0, 0) + gshift + 1.0), 'dim', 'misc');
addLabel('Sea / offshore', () => m2s(0, 500, wlz() + 1), 'water', 'misc');
const cenOf = ring => ring.reduce((a, p) => [a[0] + p[0] / ring.length, a[1] + p[1] / ring.length], [0, 0]);
const armC = M.versions[0].outline_m.slice(0, 2).map(cenOf);
addLabel('NORTH ARM', () => m2s(armC[0][0], armC[0][1], -1 + gshift), 'reef', 'reef');
addLabel('SOUTH ARM', () => m2s(armC[1][0], armC[1][1], -1 + gshift), 'reef', 'reef');
addLabel('paddle channel', () => m2s(-13, 262, -3 + gshift), 'reef dim', 'reef');
(M.crest_labels || []).forEach(c => addLabel(c.text, () => m2s(c.x, c.y, c.z + gshift + 0.2 * state.ve), 'reef dim', 'crest'));
for (let v = -100; v <= 100; v += 50) addLabel('x ' + v, () => m2s(v, 190, wlz()), 'dim', 'axis');
for (let v = 200; v <= 400; v += 50) addLabel('y ' + v, () => m2s(-120, v, wlz()), 'dim', 'axis');
bar(60, 410, 50, '50 m'); bar(60, 400, 10, '10 m');
const tmpV = new THREE.Vector3(); let lblFrame = 0;
function updateLabels(w, h) {
  const on = state.show.labels, cand = [];
  for (const L of labels) {
    L.el.style.display = 'none';
    if (!on || (L.group === 'axis' && !state.show.grid) || (L.group === 'bar' && !state.show.grid)) continue;
    const p = L.posFn(); tmpV.set(p.x, p.y * state.ve, p.z).project(camera);
    if (tmpV.z > 1 || tmpV.z < -1 || Math.abs(tmpV.x) > 1.02 || Math.abs(tmpV.y) > 1.02) continue;
    cand.push({ L, px: (tmpV.x * 0.5 + 0.5) * w, py: (-tmpV.y * 0.5 + 0.5) * h });
  }
  cand.sort((a, b) => a.L.prio - b.L.prio);
  const placed = [];                                             // greedy declutter: lower priority labels yield to higher ones
  for (const c of cand) {
    const el = c.L.el; el.style.display = 'block';
    const bw = el.offsetWidth + 4, bh = el.offsetHeight + 2, x0 = c.px - bw / 2, x1 = c.px + bw / 2, y0 = c.py - bh * 1.2, y1 = c.py - bh * 0.2;
    if (placed.some(r => x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1])) { el.style.display = 'none'; continue; }
    placed.push([x0, y0, x1, y1]); el.style.transform = `translate(${c.px}px,${c.py}px) translate(-50%,-120%)`;
  }
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

}

      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const hd = cells(l); i += 2; let rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><tr>' + hd.map(c => `<th>${inline(c)}</th>`).join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>'); continue;
    }
    if (/^\s*[-*]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) b.push('<li>' + inline(L[i++].replace(/^\s*[-*]\s+/, '')) + '</li>'); out.push('<ul>' + b.join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) b.push('<li>' + inline(L[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); out.push('<ol>' + b.join('') + '</ol>'); continue; }
    if (/^>\s?/.test(l)) { let b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(inline(L[i++].replace(/^>\s?/, ''))); out.push('<blockquote>' + b.join('<br>') + '</blockquote>'); continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (!l.trim()) { i++; continue; }
    let b = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+[.)]\s|>|\s*\|)/.test(L[i])) b.push(inline(L[i++])); out.push('<p>' + b.join(' ') + '</p>');
  }
  return out.join('\n');
}

window.addEventListener('resize', resize);

});

  const cr = $('camro'); if (cr) cr.textContent = `view: ${VIEWS[curView] ? VIEWS[curView].label : 'free'}`;
}
